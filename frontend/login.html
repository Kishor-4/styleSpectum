<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | StyleSpectrum</title>
  <link rel="stylesheet" href="style.css">
  <link rel="dns-prefetch" href="https://fonts.googleapis.com">
  <link rel="dns-prefetch" href="https://fonts.gstatic.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    .auth-page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 16px;
      background: #faf7f2;
    }

    .auth-card {
      width: 100%;
      max-width: 480px;
      padding: 36px 32px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,.08);
      border: 1px solid #ede4dc;
    }

    .auth-brand {
      text-align: center;
      margin-bottom: 20px;
    }

    .auth-brand-icon {
      display: inline-grid;
      place-items: center;
      width: 48px;
      height: 48px;
      background: #8c3b4a;
      color: white;
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 28px;
      border-radius: 12px;
      margin: 0 auto;
    }

    .auth-brand h2 {
      font-size: 24px;
      font-weight: 700;
      margin: 8px 0 2px;
      color: #211713;
    }

    .auth-brand small {
      color: #888;
      letter-spacing: 2px;
      font-size: 9px;
      text-transform: uppercase;
      font-weight: 600;
    }

    .flow-steps {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin: 16px 0 20px;
      font-size: 11px;
      font-weight: 600;
      color: #999;
    }

    .flow-step {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .flow-step.active {
      color: #8c3b4a;
      font-weight: 700;
    }

    .flow-divider {
      color: #ccc;
    }

    .auth-card h1 {
      margin: 4px 0 6px;
      font-size: 24px;
      text-align: center;
    }

    .auth-card p.subtitle {
      color: #666;
      line-height: 1.5;
      text-align: center;
      margin: 0 0 20px;
      font-size: 13px;
    }

    /* Role Selector Tabs */
    .role-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      background: #f4ede6;
      padding: 6px;
      border-radius: 12px;
      margin-bottom: 22px;
    }

    .role-tab {
      padding: 12px 10px;
      border: 2px solid transparent;
      background: transparent;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      color: #555;
      transition: all 0.2s ease;
    }

    .role-tab small {
      font-size: 10px;
      font-weight: 400;
      opacity: 0.85;
    }

    .role-tab.active {
      background: white;
      color: #8c3b4a;
      border-color: #8c3b4a;
      box-shadow: 0 4px 12px rgba(140, 59, 74, 0.12);
    }

    .auth-card label {
      display: block;
      margin: 16px 0 7px;
      font-weight: 600;
      font-size: 13px;
      color: #333;
    }

    .auth-card input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #d5cbc2;
      border-radius: 8px;
      font: inherit;
      font-size: 14px;
      box-sizing: border-box;
      background: #fafafa;
      transition: border-color 0.2s;
    }

    .auth-card input:focus {
      border-color: #8c3b4a;
      background: white;
      outline: none;
      box-shadow: 0 0 0 3px rgba(140, 59, 74, 0.15);
    }

    .auth-submit {
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #8c3b4a;
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .auth-submit:hover {
      background: #732f3c;
      transform: translateY(-1px);
    }

    .auth-message {
      margin-top: 16px;
      overflow-wrap: anywhere;
      text-align: center;
      font-size: 13px;
      line-height: 1.5;
      font-weight: 500;
    }

    .banner-registered {
      background: #edf7ee;
      border: 1px solid #c7e6c9;
      color: #2e6945;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 18px;
      text-align: center;
      font-weight: 600;
      display: none;
    }

    .auth-footer {
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid #eee;
      text-align: center;
      font-size: 13px;
      color: #666;
    }

    .auth-footer a {
      color: #8c3b4a;
      font-weight: 700;
      text-decoration: none;
      margin-left: 4px;
    }

    .auth-footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <main class="auth-page">
    <section class="auth-card">
      <!-- Brand Header -->
      <div class="auth-brand">
        <div class="auth-brand-icon">S</div>
        <h2>Style<span style="font-weight: 400;">Spectrum</span></h2>
        <small>Fashion for every you</small>
      </div>

      <!-- Flow Step Indicator: Register -> Login -> Website -->
      <div class="flow-steps">
        <span class="flow-step">1. Register</span>
        <span class="flow-divider">→</span>
        <span class="flow-step active">2. Login</span>
        <span class="flow-divider">→</span>
        <span class="flow-step">3. Store</span>
      </div>

      <div id="registeredBanner" class="banner-registered">
        🎉 Registration successful! Please log in with your credentials to enter the store.
      </div>

      <h1 id="loginTitle">Account Login</h1>
      <p class="subtitle" id="loginSubtitle">Select your role and enter your details to sign in.</p>

      <!-- Role Selector Tabs: Customer vs Shopkeeper -->
      <div class="role-tabs" role="tablist">
        <button type="button" class="role-tab active" id="tabCustomer" role="tab" aria-selected="true">
          <span>🛒 Customer</span>
          <small>Shop & Order</small>
        </button>
        <button type="button" class="role-tab" id="tabShopkeeper" role="tab" aria-selected="false">
          <span>🏪 Shopkeeper</span>
          <small>Manage Store</small>
        </button>
      </div>

      <form id="loginForm">
        <input type="hidden" id="loginRole" name="role" value="customer">

        <label for="email">Email Address</label>
        <input
          id="email"
          name="email"
          type="email"
          placeholder="Enter your registered email"
          autocomplete="email"
          required
        >

        <label for="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          required
        >

        <button class="auth-submit" id="loginSubmitBtn" type="submit">
          Login as Customer ↗
        </button>

        <p id="loginMessage" class="auth-message" role="status" aria-live="polite"></p>
      </form>

      <div class="auth-footer">
        Don't have an account yet?
        <a href="register.html">Register First ↗</a>
      </div>
    </section>
  </main>

  <script src="login.js"></script>
</body>
</html>
