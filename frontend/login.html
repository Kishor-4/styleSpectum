
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | StyleSpectrum</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .auth-page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 16px;
      background: #faf7f2;
    }

    .auth-card {
      width: 100%;
      max-width: 460px;
      padding: 32px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,.08);
    }

    .auth-card h1 {
      margin: 12px 0;
      font-size: 30px;
    }

    .auth-card p {
      color: #666;
      line-height: 1.6;
    }

    .auth-card label {
      display: block;
      margin: 16px 0 7px;
      font-weight: 600;
    }

    .auth-card input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font: inherit;
    }

    .auth-submit {
      width: 100%;
      margin-top: 22px;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #8c3b4a;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .auth-message {
      overflow-wrap: anywhere;
    }

    .auth-footer {
      margin-top: 20px;
      text-align: center;
    }

    .auth-footer a,
    .auth-back {
      color: #8c3b4a;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main class="auth-page">
    <section class="auth-card">
      <a class="auth-back" href="index.html">
        ← Back to StyleSpectrum
      </a>

      <h1>Welcome Back!</h1>
      <p>Login to continue shopping or managing your store.</p>

      <form id="loginForm">
        <label for="email">Email Address</label>
        <input
          id="email"
          name="email"
          type="email"
          placeholder="Enter your email"
          autocomplete="email"
          required
        >

        <label for="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          required
        >

        <button class="auth-submit" type="submit">
          Login
        </button>

        <p id="loginMessage" class="auth-message"
           role="status" aria-live="polite"></p>
      </form>

      <div class="auth-footer">
        New to StyleSpectrum?
        <a href="register.html">Create an account</a>
      </div>
    </section>
  </main>

  <script src="login.js"></script>
</body>
</html>
