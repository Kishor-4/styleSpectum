<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome | StyleSpectrum</title>
</head>
<body style="font-family: sans-serif; text-align: center; padding: 50px;">
  <p>Opening StyleSpectrum...</p>
  <script>
    const token = localStorage.getItem("stylespectrum_token") || sessionStorage.getItem("stylespectrum_token");
    if (token) {
      window.location.replace("index.html");
    } else {
      window.location.replace("login.html");
    }
  </script>
</body>
</html>
