<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="theme-color" content="#dc2626">
  <title>Create Account | StyleSpectrum</title>
  <link rel="stylesheet" href="style.css?v=2.2">
  <link rel="dns-prefetch" href="https://fonts.googleapis.com">
  <link rel="dns-prefetch" href="https://fonts.gstatic.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <style>
    .auth-page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 36px 16px;
      background: #f8fafc;
    }

    .auth-card {
      width: 100%;
      max-width: 480px;
      padding: 36px 32px;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 12px 36px rgba(15, 23, 42, 0.08);
      border: 1px solid #e2e8f0;
    }

    .auth-brand {
      text-align: center;
      margin-bottom: 16px;
    }

    .auth-brand-icon {
      display: inline-grid;
      place-items: center;
      width: 46px;
      height: 46px;
      background: linear-gradient(135deg, #dc2626 0%, #991b1b 100%);
      color: white;
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 26px;
      font-weight: 700;
      border-radius: 12px;
      margin: 0 auto;
      box-shadow: 0 4px 14px rgba(220, 38, 38, 0.25);
    }

    .auth-brand h2 {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin: 10px 0 2px;
      color: #0f172a;
    }

    .auth-brand small {
      color: #64748b;
      letter-spacing: 2px;
      font-size: 9.5px;
      text-transform: uppercase;
      font-weight: 700;
    }

    .flow-steps {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin: 14px 0 18px;
      font-size: 11.5px;
      font-weight: 600;
      color: #94a3b8;
    }

    .flow-step.active {
      color: #dc2626;
      font-weight: 800;
    }

    .auth-card h1 {
      margin: 4px 0 6px;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
      text-align: center;
      color: #0f172a;
    }

    .auth-card p {
      color: #475569;
      line-height: 1.5;
      text-align: center;
      margin: 0 0 18px;
      font-size: 13.5px;
    }

    .role-selector {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 18px 0 14px;
    }

    .role-option {
      position: relative;
    }

    .role-option input {
      display: none;
    }

    .role-label {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px 8px;
      border: 2px solid #e2e8f0;
      background: #f8fafc;
      border-radius: 12px;
      cursor: pointer;
      font-size: 13.5px;
      font-weight: 700;
      color: #475569;
      transition: all 0.2s ease;
      text-align: center;
    }

    .role-label span {
      font-size: 22px;
      margin-bottom: 4px;
    }

    .role-label small {
      font-size: 10.5px;
      font-weight: 500;
      color: #64748b;
    }

    .role-option input:checked + .role-label {
      border-color: #dc2626;
      background: #fef2f2;
      color: #dc2626;
      box-shadow: 0 4px 12px rgba(220, 38, 38, 0.12);
    }

    .auth-card label {
      display: block;
      margin: 14px 0 6px;
      font-weight: 700;
      font-size: 13px;
      color: #334155;
    }

    .auth-card input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      font: inherit;
      font-size: 14px;
      box-sizing: border-box;
      background: #ffffff;
      color: #0f172a;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .auth-card input:focus {
      border-color: #dc2626;
      outline: none;
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.15);
    }

    .shopkeeper-section {
      background: #fff7ed;
      border: 1px dashed #fed7aa;
      padding: 14px 16px;
      border-radius: 12px;
      margin-top: 16px;
    }

    .shopkeeper-section h4 {
      margin: 0 0 6px;
      color: #ea580c;
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .auth-submit {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #dc2626;
      color: white;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(220, 38, 38, 0.25);
      transition: all 0.2s ease;
    }

    .auth-submit:hover {
      background: #b91c1c;
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(220, 38, 38, 0.35);
    }

    .auth-message {
      margin-top: 16px;
      overflow-wrap: anywhere;
      font-size: 13px;
      text-align: center;
      font-weight: 600;
    }

    .auth-footer {
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid #f1f5f9;
      text-align: center;
      font-size: 13px;
      color: #64748b;
    }

    .auth-footer a {
      color: #dc2626;
      font-weight: 700;
      text-decoration: none;
      margin-left: 4px;
    }

    .auth-footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <main class="auth-page">
    <section class="auth-card">
      <div class="auth-brand">
        <div class="auth-brand-icon">S</div>
        <h2>Style<span style="font-weight: 400; color: #dc2626;">Spectrum</span></h2>
        <small>Fashion for every you</small>
      </div>

      <!-- Flow Step Indicator: Register -> Login -> Website -->
      <div class="flow-steps">
        <span class="flow-step active">1. Register</span>
        <span style="color: #cbd5e1;">→</span>
        <span class="flow-step">2. Login</span>
        <span style="color: #cbd5e1;">→</span>
        <span class="flow-step">3. Store</span>
      </div>

      <h1>Create Your Account</h1>
      <p>Register as a customer to shop or as a shopkeeper to sell.</p>

      <form id="registerForm">
        <label>I want to register as:</label>
        <div class="role-selector">
          <label class="role-option">
            <input type="radio" name="role" value="customer" checked>
            <div class="role-label">
              <span>🛒</span>
              Customer
              <small>Shop fashion pieces</small>
            </div>
          </label>

          <label class="role-option">
            <input type="radio" name="role" value="shopkeeper">
            <div class="role-label">
              <span>🏪</span>
              Shopkeeper
              <small>Sell & add products</small>
            </div>
          </label>
        </div>

        <label for="name">Full Name</label>
        <input id="name" name="name" type="text"
               placeholder="Enter your full name"
               autocomplete="name" required>

        <label for="email">Email Address</label>
        <input id="email" name="email" type="email"
               placeholder="you@example.com"
               autocomplete="email" required>

        <label for="mobile">Mobile Number</label>
        <input id="mobile" name="mobile" type="tel"
               placeholder="10-digit mobile number"
               inputmode="numeric" pattern="[0-9]{10}"
               maxlength="10" autocomplete="tel" required>

        <label for="password">Password</label>
        <input id="password" name="password" type="password"
               placeholder="At least 8 characters"
               minlength="8" autocomplete="new-password" required>

        <!-- Shopkeeper specific fields -->
        <div class="shopkeeper-section" id="shopkeeperFields" style="display: none;">
          <h4>🏪 Shopkeeper Details</h4>
          <label for="shopName" style="margin-top: 4px;">Shop Name (दुकान का नाम) *</label>
          <input id="shopName" name="shopName" type="text"
                 placeholder="e.g. Spectrum Boutique / Sharma Handloom">

          <label for="shopAddress">Shop City / Location</label>
          <input id="shopAddress" name="shopAddress" type="text"
                 placeholder="e.g. Bapu Bazar, Jaipur">
        </div>

        <button class="auth-submit" type="submit" id="submitBtn">
          Create Account ↗
        </button>

        <p id="registerMessage" class="auth-message"
           role="status" aria-live="polite"></p>
      </form>

      <div class="auth-footer">
        Already have an account?
        <a href="login.html">Sign In Here ↗</a>
      </div>

      <div style="margin-top: 14px; text-align: center;">
        <a href="index.html" class="outline-btn full-btn" style="padding: 10px; font-size: 13px;">
          🛍️ Continue to Store as Guest ↗
        </a>
      </div>
    </section>
  </main>
  <script src="register.js"></script>
</body>
</html>
